<article class="card book-card mb-3">
    <div class="card-body">
        <h2 class="card-title">
            {{ book.title|default:"Без названия" }}
        </h2>
        <p class="card-text">
            Автор: {{ book.author }}<br>
            Год: {{ book.year }}<br>
            Статус: <span class="badge bg-secondary">{{ book.get_status_display|default:book.status }}</span>
        </p>
        <a href="{% url 'books:detail' book.slug %}" class="btn btn-primary">Подробнее</a>
    </div>
</article>
